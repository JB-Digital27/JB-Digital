<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>JB Digital · Standorte</title>
    <script>
      // Gespeicherte Hell/Dunkel-Wahl sofort anwenden, damit nichts aufblitzt
      try {
        var d = localStorage.getItem('jb-digital-darstellung')
        if (d === 'dunkel') document.documentElement.setAttribute('data-theme', 'dark')
        if (d === 'hell') document.documentElement.setAttribute('data-theme', 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
