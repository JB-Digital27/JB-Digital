<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partnerkarte · JB Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#F3F4F1;--surface:#FFFFFF;--surface2:#F3F4F1;--border:#E1E4DE;--border-strong:#C5CCC4;
  --text:#16202A;--sub:#3C4651;--muted:#56606B;--link:#1D4ED8;--primary:#16202A;--on-primary:#FFFFFF;
  --blue:#1D4ED8;--blue-soft:#DCE6FB;--blue-text:#1E3A8A;--orange:#E8710A;--orange-soft:#FDEBD9;--orange-text:#8A4A0B;
  --green-soft:#DCF3E4;--green-text:#14632F;--gray-soft:#E7E9E5;--danger:#B42318;--danger-soft:#FDE8E6;--tip:#16202A;--tip-text:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141A;--surface:#161F28;--surface2:#1D2833;--border:#26323E;--border-strong:#3A4855;
    --text:#E7EBEF;--sub:#C3CBD3;--muted:#9AA5B1;--link:#8CB0FF;--primary:#E7EBEF;--on-primary:#0E141A;
    --blue:#4F7DF0;--blue-soft:#1C2C4F;--blue-text:#B9CCFF;--orange:#F28A2E;--orange-soft:#3A2614;--orange-text:#FFC48F;
    --green-soft:#15331F;--green-text:#8FE0A8;--gray-soft:#26323E;--danger:#FF8A80;--danger-soft:#3A1A18;--tip:#E7EBEF;--tip-text:#0E141A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141A;--surface:#161F28;--surface2:#1D2833;--border:#26323E;--border-strong:#3A4855;
  --text:#E7EBEF;--sub:#C3CBD3;--muted:#9AA5B1;--link:#8CB0FF;--primary:#E7EBEF;--on-primary:#0E141A;
  --blue:#4F7DF0;--blue-soft:#1C2C4F;--blue-text:#B9CCFF;--orange:#F28A2E;--orange-soft:#3A2614;--orange-text:#FFC48F;
  --green-soft:#15331F;--green-text:#8FE0A8;--gray-soft:#26323E;--danger:#FF8A80;--danger-soft:#3A1A18;--tip:#E7EBEF;--tip-text:#0E141A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:3px solid #4F7DF0;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0}
.display{font-family:"Space Grotesk",Inter,sans-serif}

header{display:flex;flex-wrap:wrap;align-items:center;gap:16px 20px;padding:16px 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 220px}
.logo{width:42px;height:42px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font-family:"Space Grotesk",sans-serif;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:13px}
.search{flex:3 1 340px;display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border:1px solid var(--border-strong);border-radius:12px;background:var(--surface)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:15px}
.icon-btn{width:46px;height:46px;border:1px solid var(--border-strong);border-radius:12px;background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--border-strong);background:transparent;font-weight:600;font-size:14px;cursor:pointer}
.btn-primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn-blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-danger{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn-ghost-danger{border:0;color:var(--danger);padding:0 4px;align-self:flex-start}
.btn-sm{min-height:38px;padding:0 12px;font-size:13px;border-radius:9px}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 24px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.chip .n{font-weight:500;opacity:.8}
.dot{width:10px;height:10px;flex:none;border-radius:50%;background:var(--blue)}
.dot.f{border-radius:2px;background:var(--orange);transform:rotate(45deg)}
.dot.all{background:currentColor}
select.inp,input.inp,textarea.inp{height:44px;padding:0 12px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);font-size:14px;width:100%}
textarea.inp{height:auto;padding:10px 12px;resize:vertical}
.stats{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.stats b{color:var(--text)}

main{display:flex;flex-wrap:wrap;gap:20px;padding:16px 24px 32px;align-items:flex-start}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px}
#listPanel{flex:1 1 290px;min-width:0;padding:14px;display:flex;flex-direction:column}
#mapCol{flex:999 1 520px;min-width:0}
#detailCol{flex:1 1 340px;min-width:0}
.list-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 10px}
.list-head span{font-size:13px;color:var(--muted)}
#list{display:flex;flex-direction:column;gap:8px;max-height:700px;overflow-y:auto}
.item{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 12px;text-align:left;border-radius:12px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.item[aria-current="true"]{border-color:var(--text);background:var(--surface2)}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column}
.item .t b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px}
.b-free{background:var(--green-soft);color:var(--green-text)}
.b-full{background:var(--gray-soft);color:var(--sub)}
.b-p{background:var(--blue-soft);color:var(--blue-text)}
.list-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.list-foot .acts{display:flex;gap:6px;flex-wrap:wrap}

#mapWrap{position:relative;height:min(78vh,760px);min-height:420px;border-radius:16px;overflow:hidden;border:1px solid var(--border)}
#map{position:absolute;inset:0;background:var(--surface2)}
.dark-map .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.88) saturate(.7)}
.leaflet-container{font-family:Inter,system-ui,sans-serif}
.leaflet-control-zoom a,.leaflet-bar a{background:var(--surface)!important;color:var(--text)!important;border-color:var(--border)!important;width:40px!important;height:40px!important;line-height:40px!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 85%,transparent)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--link)!important}
#placeBanner{position:absolute;top:12px;left:60px;right:12px;z-index:900;padding:10px 14px;border-radius:10px;background:var(--blue);color:#fff;font-size:13px;font-weight:600;display:none}
.placing #placeBanner{display:block}
.placing #map{cursor:crosshair}
.legend{position:absolute;left:12px;bottom:28px;z-index:800;display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:10px;font-size:12px;color:var(--sub)}
.legend span{display:flex;align-items:center;gap:6px}
.ring{width:12px;height:12px;border-radius:3px;border:3px solid var(--blue);transform:rotate(45deg)}
#hint{margin-top:10px;font-size:13px;color:var(--muted);min-height:1em}

.pin{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pin i{display:block;width:17px;height:17px;background:var(--orange);border:3px solid #fff;border-radius:4px;transform:rotate(45deg);box-shadow:0 2px 5px rgba(0,0,0,.35);transition:all .15s}
.pin.hi i{width:22px;height:22px;box-shadow:0 0 0 4px var(--blue),0 4px 10px rgba(0,0,0,.3)}
.pin.sel i{width:25px;height:25px;box-shadow:0 0 0 5px rgba(232,113,10,.4),0 4px 10px rgba(0,0,0,.35)}
.pin.dim{opacity:.35}
.pin .lbl{display:none;position:absolute;top:42px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:4px 10px;border-radius:8px;background:var(--tip);color:var(--tip-text);font-size:12px;font-weight:600}
.pin.sel .lbl,.pin.hi .lbl{display:block}
.draft-pin{width:26px;height:26px;border-radius:50%;border:3px solid var(--blue);background:var(--blue-soft);box-shadow:0 0 0 6px rgba(79,125,240,.25)}

.card{display:flex;flex-direction:column;gap:18px;padding:22px}
.kind{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.k-f{background:var(--orange-soft);color:var(--orange-text)}
.k-p{background:var(--blue-soft);color:var(--blue-text)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.muted{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts div{padding:10px 12px;border-radius:10px;background:var(--surface2)}
.facts small{display:block;font-size:12px;color:var(--muted)}
.facts b{font-size:14px}
.links{display:flex;flex-direction:column;gap:8px}
.link{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);text-align:left;cursor:pointer}
.link .t{flex:1;min-width:0;display:flex;flex-direction:column}
.link .t span{font-size:12px;color:var(--muted)}
.empty{font-size:13px;color:var(--muted);padding:10px 12px;border:1px dashed var(--border-strong);border-radius:10px}
.contact{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:12px;background:var(--surface2)}
.contact a{display:flex;align-items:center;gap:10px;min-height:32px;text-decoration:none;font-size:14px}
.placeholder{padding:28px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--border-strong);border-radius:16px;background:var(--surface)}

form.card{gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--sub)}
.two{display:flex;flex-wrap:wrap;gap:12px}
.two>*{flex:1 1 140px}
fieldset{margin:0;padding:10px 12px;border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;gap:2px;max-height:260px;overflow-y:auto}
legend{padding:0 6px;font-size:13px;font-weight:600;color:var(--sub)}
.check{display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.posbox{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:13px}
.err{font-size:13px;color:var(--danger)}
.confirm{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:10px;background:var(--danger-soft);font-size:13px}
hr{border:0;border-top:1px solid var(--border);margin:4px 0}
@media (max-width:640px){header,.toolbar,main{padding-left:16px;padding-right:16px}.stats{margin-left:0}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo" aria-hidden="true">JB</div>
    <div><div class="display" style="font-weight:700;font-size:20px;line-height:1.2">Partnerkarte</div><small>JB Digital · Kreis Gütersloh</small></div>
  </div>
  <label class="search">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <span class="sr">Suche</span>
    <input id="q" type="search" placeholder="Werbetreibende, Werbeflächen, Orte oder Ansprechpartner suchen …">
  </label>
  <button id="themeBtn" class="icon-btn" type="button" aria-label="Darstellung wechseln"></button>
  <button id="addBtn" class="btn btn-primary" type="button" style="height:46px">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Neu hinzufügen
  </button>
</header>

<div class="toolbar">
  <div class="chips" role="group" aria-label="Liste filtern" id="chips"></div>
  <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub)">Ort
    <select id="town" class="inp" style="width:auto"></select>
  </label>
  <div class="stats" id="stats"></div>
</div>

<main>
  <section id="listPanel" class="panel" aria-label="Ergebnisliste">
    <div class="list-head"><h2 class="display" style="font-size:17px">Ergebnisse</h2><span id="count"></span></div>
    <div id="list"></div>
    <div class="list-foot">
      <span id="storeInfo">Änderungen werden in diesem Browser gespeichert.</span>
      <div class="acts">
        <button class="btn btn-sm" type="button" id="exportBtn">Export</button>
        <button class="btn btn-sm" type="button" id="importBtn">Import</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
    </div>
  </section>

  <section id="mapCol" aria-label="Karte">
    <div id="mapWrap">
      <div id="map"></div>
      <div id="placeBanner" role="status">Auf die Karte klicken, um den Standort zu setzen.</div>
      <div class="legend">
        <span><i class="dot f" aria-hidden="true"></i>Werbefläche</span>
        <span><i class="ring" aria-hidden="true"></i>Fläche des gewählten Partners</span>
      </div>
    </div>
    <div id="hint" aria-live="polite"></div>
  </section>

  <aside id="detailCol" aria-label="Details"></aside>
</main>

var S={entries:load(),q:'',kind:'all',town:'all',selected:'f1',mode:'view',draft:null,placing:false,askDelete:false,error:'',geoMsg:''};
function clone(o){return JSON.parse(JSON.stringify(o));}
function load(){try{var r=localStorage.getItem(STORE_KEY);if(r){var d=JSON.parse(r);if(Array.isArray(d))return d;}}catch(e){}return clone(SEED);}
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(S.entries));}catch(e){document.getElementById('storeInfo').textContent='Speichern im Browser nicht möglich – bitte exportieren.';}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function byId(id){for(var i=0;i<S.entries.length;i++)if(S.entries[i].id===id)return S.entries[i];return null;}
function partners(){return S.entries.filter(function(e){return e.kind==='partner';});}
function flaechen(){return S.entries.filter(function(e){return e.kind==='flaeche';});}
function flaechenOf(pid){return flaechen().filter(function(f){return (f.advertisers||[]).indexOf(pid)!==-1;});}
function used(f){return (f.advertisers||[]).length;}
function sortDe(a,b){return a.name.localeCompare(b.name,'de');}
function matchesQ(e){
  var q=S.q.trim().toLowerCase(); if(!q)return true;
  var rel=e.kind==='flaeche'?(e.advertisers||[]).map(function(id){var p=byId(id);return p?p.name:'';}).join(' '):flaechenOf(e.id).map(function(f){return f.name;}).join(' ');
  return [e.name,e.category,e.town,e.street,e.person,e.role,e.email,e.format,e.note,rel].join(' ').toLowerCase().indexOf(q)!==-1;
}
function matchesTown(e){return S.town==='all'||e.town===S.town;}

}

// ---------- Map ----------
var map=L.map('map',{zoomControl:true,minZoom:9,maxZoom:19}).fitBounds(KREIS_BOUNDS);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>-Mitwirkende'}).addTo(map);
var markerLayer=L.layerGroup().addTo(map);
var draftMarker=null;
map.on('click',function(ev){
  if(!S.placing||!S.draft)return;
  S.draft.lat=+ev.latlng.lat.toFixed(6);S.draft.lng=+ev.latlng.lng.toFixed(6);S.draft.posSet=true;S.placing=false;S.geoMsg='Standort per Klick gesetzt.';
  render();
});

function renderMap(){
  markerLayer.clearLayers();
  var sel=byId(S.selected); var selP=sel&&sel.kind==='partner'?sel:null;
  var hi=selP?flaechenOf(selP.id).map(function(f){return f.id;}):[];
  var q=S.q.trim();
  flaechen().filter(matchesTown).forEach(function(f){
    if(f.lat==null||f.lng==null)return;
    var cls='pin'+(f.id===S.selected?' sel':'')+(hi.indexOf(f.id)!==-1?' hi':'')+(((selP&&hi.indexOf(f.id)===-1)||(!selP&&q&&!matchesQ(f)))?' dim':'');
    var icon=L.divIcon({className:'',html:'<div class="'+cls+'"><i></i><span class="lbl">'+esc(f.name)+'</span></div>',iconSize:[44,44],iconAnchor:[22,22]});
    var m=L.marker([f.lat,f.lng],{icon:icon,title:f.name,alt:'Werbefläche: '+f.name,keyboard:true,riseOnHover:true,zIndexOffset:f.id===S.selected?1000:(hi.indexOf(f.id)!==-1?500:0)});
    m.on('click',function(){if(S.placing)return;select(f.id,false);});
    m.on('keypress',function(e){if(e.originalEvent.key==='Enter'){select(f.id,false);}});
    markerLayer.addLayer(m);
  });
  if(draftMarker){map.removeLayer(draftMarker);draftMarker=null;}
  if(S.mode!=='view'&&S.draft&&S.draft.kind==='flaeche'&&S.draft.lat!=null){
    draftMarker=L.marker([S.draft.lat,S.draft.lng],{icon:L.divIcon({className:'',html:'<div class="draft-pin"></div>',iconSize:[26,26],iconAnchor:[13,13]}),interactive:false}).addTo(map);
  }
  document.getElementById('mapWrap').classList.toggle('placing',S.placing);
  var hint=document.getElementById('hint');
  hint.textContent=selP?(hi.length?'Blau markiert: '+hi.length+' Werbefläche'+(hi.length===1?'':'n')+', auf denen '+selP.name+' wirbt.':selP.name+' hat noch keine Werbefläche gebucht.'):'';
}

function select(id,fly){
  S.selected=id;S.mode='view';S.placing=false;S.askDelete=false;
  render();
  var e=byId(id); if(!e)return;
  if(e.kind==='flaeche'&&e.lat!=null){ if(fly!==false||!map.getBounds().contains([e.lat,e.lng]))map.flyTo([e.lat,e.lng],Math.max(map.getZoom(),14),{duration:.6}); }
  else if(e.kind==='partner'){var fs=flaechenOf(e.id).filter(function(f){return f.lat!=null;});if(fs.length){var b=L.latLngBounds(fs.map(function(f){return [f.lat,f.lng];}));map.flyToBounds(b.pad(0.4),{maxZoom:14,duration:.6});}}
}

function renderList(){

    .sort(function(a,b){return a.kind!==b.kind?(a.kind==='flaeche'?-1:1):sortDe(a,b);});

function blank(kind){return {id:null,kind:kind,name:'',category:'',town:'Gütersloh',street:'',format:'',slots:4,person:'',role:'',phone:'',email:'',web:'',note:'',lat:null,lng:null,posSet:false,advertisers:[],flaechenIds:[]};}

  var e=byId(S.selected);if(!e)return;
  var d=Object.assign(blank(e.kind),clone(e));d.posSet=e.lat!=null;d.advertisers=(e.advertisers||[]).slice();

   +(S.error?'<div class="err" role="alert">'+esc(S.error)+'</div>':'')
   +'<div class="two"><button type="submit" class="btn btn-blue" style="flex:2 1 160px">Speichern</button><button type="button" class="btn" id="cancelForm" style="flex:1 1 100px">Abbrechen</button></div>'
   +(S.mode==='edit'?(S.askDelete?'<div class="confirm" role="alert">„'+esc(d.name)+'“ wirklich löschen? Das lässt sich nicht rückgängig machen.<div style="display:flex;gap:8px"><button type="button" class="btn btn-sm btn-danger" id="delYes">Endgültig löschen</button><button type="button" class="btn btn-sm" id="delNo">Behalten</button></div></div>':'<button type="button" class="btn btn-sm btn-ghost-danger" id="delBtn">Eintrag löschen</button>'):'')
   +'</form>';
}
function readForm(){
  var d=S.draft,g=function(id){var el=document.getElementById(id);return el?el.value:null;};
  ['name','category','street','format','person','role','phone','email','web','note'].forEach(function(k){var v=g('d_'+k);if(v!==null)d[k]=v;});
  var sl=g('d_slots');if(sl!==null)d.slots=sl;
  var rel=[].slice.call(document.querySelectorAll('#form .rel')).filter(function(c){return c.checked;}).map(function(c){return c.value;});
  if(d.kind==='flaeche')d.advertisers=rel;else d.flaechenIds=rel;
}
function bindForm(){
  var f=document.getElementById('form');
  var close=function(){S.mode='view';S.placing=false;S.askDelete=false;render();};
  document.getElementById('closeForm').onclick=close;document.getElementById('cancelForm').onclick=close;
  var k=document.getElementById('d_kind');if(k)k.onchange=function(){readForm();S.draft.kind=k.value;render();};
  document.getElementById('d_town').onchange=function(e){readForm();S.draft.town=e.target.value;if(!S.draft.posSet){S.draft.lat=null;S.draft.lng=null;}render();};
  var pb=document.getElementById('placeBtn');if(pb)pb.onclick=function(){readForm();S.placing=!S.placing;render();};
  var gb=document.getElementById('geoBtn');if(gb)gb.onclick=function(){readForm();geocode();};
  var db=document.getElementById('delBtn');if(db)db.onclick=function(){readForm();S.askDelete=true;render();};
  var dn=document.getElementById('delNo');if(dn)dn.onclick=function(){S.askDelete=false;render();};
  var dy=document.getElementById('delYes');if(dy)dy.onclick=doDelete;
  f.onsubmit=function(ev){ev.preventDefault();readForm();save();};
}
function geocode(){
  var d=S.draft,t=TOWNS[d.town]||{plz:''};
  var q=[d.street,(t.plz+' '+d.town).trim(),'Deutschland'].filter(Boolean).join(', ');
  S.geoMsg='Suche Adresse …';render();
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=de&q='+encodeURIComponent(q),{headers:{'Accept-Language':'de'}})
    .then(function(r){return r.json();})
    .then(function(res){
      if(res&&res[0]){S.draft.lat=+(+res[0].lat).toFixed(6);S.draft.lng=+(+res[0].lon).toFixed(6);S.draft.posSet=true;S.geoMsg='Adresse gefunden – bitte Position prüfen.';map.flyTo([S.draft.lat,S.draft.lng],16,{duration:.6});}
      else S.geoMsg='Adresse nicht gefunden – bitte auf der Karte klicken.';
      render();
    }).catch(function(){S.geoMsg='Adresssuche nicht erreichbar – bitte auf der Karte klicken.';render();});
}
function save(){
  var d=S.draft;
  if(!d.name.trim()){S.error='Bitte einen Namen eingeben.';render();return;}
  var id=d.id||('n'+Date.now());
  var e={id:id,kind:d.kind,name:d.name.trim(),category:d.category.trim(),town:d.town,street:d.street.trim(),person:d.person.trim(),role:d.role.trim(),phone:d.phone.trim(),email:d.email.trim(),web:d.web.trim(),note:d.note.trim()};
  if(d.kind==='flaeche'){
    var lat=d.lat,lng=d.lng;
    if(lat==null){var t=TOWNS[d.town],n=flaechen().filter(function(x){return x.town===d.town&&x.id!==id;}).length+1,a=n*2.4;lat=+(t.lat+Math.sin(a)*0.004).toFixed(6);lng=+(t.lng+Math.cos(a)*0.006).toFixed(6);}
    e.lat=lat;e.lng=lng;e.format=d.format.trim();e.slots=Math.max(1,parseInt(d.slots,10)||4);e.advertisers=d.advertisers.slice();
  }
  var list=S.entries.slice(),idx=-1;list.forEach(function(x,i){if(x.id===id)idx=i;});
  if(idx===-1)list.push(e);else list[idx]=e;
  if(d.kind==='partner'){list=list.map(function(x){if(x.kind!=='flaeche')return x;var adv=(x.advertisers||[]).filter(function(a){return a!==id;});if(d.flaechenIds.indexOf(x.id)!==-1)adv.push(id);return Object.assign({},x,{advertisers:adv});});}
  S.entries=list;persist();select(id,true);
}
function doDelete(){
  var id=S.draft&&S.draft.id;if(!id)return;
  S.entries=S.entries.filter(function(x){return x.id!==id;}).map(function(x){return x.kind==='flaeche'?Object.assign({},x,{advertisers:(x.advertisers||[]).filter(function(a){return a!==id;})}):x;});
  persist();S.selected=null;S.mode='view';S.askDelete=false;render();
}

// ---------- Export / Import ----------
document.getElementById('exportBtn').addEventListener('click',function(){
  var blob=new Blob([JSON.stringify(S.entries,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='partnerkarte-daten.json';document.body.appendChild(a);a.click();a.remove();
});
document.getElementById('importBtn').addEventListener('click',function(){document.getElementById('importFile').click();});
document.getElementById('importFile').addEventListener('change',function(ev){
  var file=ev.target.files[0];if(!file)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;S.entries=d;persist();S.selected=null;S.mode='view';render();}catch(e){alert('Die Datei konnte nicht gelesen werden.');}ev.target.value='';};
  r.readAsText(file);
});

// ---------- Render ----------
function render(){renderToolbar();renderList();renderMap();renderDetail();}
applyTheme();render();
})();
</script>
</body>
</html>
